[project]
name = "bach-viet-cam-rhythm-service"
version = "0.1.0"
description = "RabbitMQ worker and result API for Bach Viet Cam audio rhythm evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "aio-pika>=9.5,<10",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "librosa>=0.11,<1",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "soundfile>=0.13,<1",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]
