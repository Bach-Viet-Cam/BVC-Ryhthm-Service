name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTAINER_NAME: bvc-rhythm-service
  COMPOSE_PROJECT: bvc-rhythm-service

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Compile check
        run: uv run python -m compileall -q app migrations
      - name: Run tests
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests/ directory yet — skipping pytest."
          fi

  docker-validate:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: [self-hosted, Windows]
    environment: production
    concurrency:
      group: deploy-rhythm-service
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env from secrets
        env:
          # Every secret of the "production" environment (or repo/org) becomes one KEY=value line
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          $secrets = $env:SECRETS_JSON | ConvertFrom-Json
          $lines = $secrets.PSObject.Properties |
            Where-Object { $_.Name -ne 'github_token' } |
            ForEach-Object { "$($_.Name)=$($_.Value)" }
          if (-not $lines) {
            Write-Error "CRITICAL: no secrets found in the 'production' environment!"
            exit 1
          }
          # UTF-8 without BOM so docker compose parses the first key correctly
          [System.IO.File]::WriteAllLines("$PWD\.env", [string[]]$lines, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Wrote .env with keys: $(($secrets.PSObject.Properties.Name | Where-Object { $_ -ne 'github_token' }) -join ', ')"

      - name: Remove container owned by another compose project
        run: |
          # The container used to be managed by the monorepo compose project; free its name once.
          $owner = docker ps -a --filter "name=^$env:CONTAINER_NAME$" --format '{{.Label "com.docker.compose.project"}}'
          if ($owner -and $owner -ne $env:COMPOSE_PROJECT) {
            Write-Host "Removing $env:CONTAINER_NAME (owned by compose project '$owner')"
            docker rm -f $env:CONTAINER_NAME
          }

      - name: Rebuild and restart with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Smoke test health endpoint
        run: |
          for ($i = 1; $i -le 10; $i++) {
            curl.exe -fsS http://localhost:8001/health
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          Write-Error "Rhythm service health check failed"
          exit 1
